<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>共同的努力</title>
    <meta
      name="description"
      content="把自律变成闯关游戏：每天打卡小目标，攒积分换自己定的奖励。数据只存在本机，离线可用。"
    />
    <meta name="application-name" content="共同的努力" />
    <meta name="theme-color" content="#F7F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%BASE_URL%app-icon/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="%BASE_URL%app-icon/favicon.svg" type="image/svg+xml" />
    <link
      rel="apple-touch-icon"
      href="%BASE_URL%app-icon/apple-touch-icon-180.png"
      sizes="180x180"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="共同的努力" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link
      rel="preload"
      href="%BASE_URL%fonts/NunitoNum-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      try {
        var theme = localStorage.getItem("qc-theme") || "system";
        var dark =
          theme === "dark" ||
          (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
