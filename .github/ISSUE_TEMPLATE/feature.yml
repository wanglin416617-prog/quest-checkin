name: 功能建议
description: 提出新的功能或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: input
    id: story
    attributes:
      label: 关联用户故事（如有）
      placeholder: US-xx
  - type: dropdown
    id: goal_type
    attributes:
      label: 相关目标类型
      options:
        - 通用 / 习惯
        - 计数
        - 减重
        - 存钱
        - 平台或基础设施
        - 不适用
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: 要解决什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: false
  - type: checkboxes
    id: impact
    attributes:
      label: 可能的影响面
      options:
        - label: 可能改动规则引擎（src/domain 或 src/goalTypes）
        - label: 可能改动数据 schema 或备份格式
